# PRsense configuration
# This file defines *review behavior*.
# Secrets and infrastructure settings belong in .env

llm:
  # LLM provider to use for reviews
  # Supported: ollama, openai
  provider: ollama

  # Model name as understood by the provider
  model: qwen2.5-coder

  # Lower values = more deterministic reviews
  temperature: 0.1

review:
  # Minimum confidence (0–1) required for a signal to be reported
  confidenceThreshold: 0.6

  # Hard cap on the number of signals per PR
  # Helps prevent noisy reviews
  maxSignals: 10

rules:
  # Explicitly enabled review rules.
  # Empty list = engine defaults.
  enable:
    - todo-detection

  # Override default severities for specific rules
  severityOverrides:
    todo-detection: low

rag:
  # Enable basic RAG-based context retrieval
  enabled: true

  # Maximum number of retrieved context chunks
  # Higher values = more context, more tokens
  maxChunks: 5

git:
  baseBranch: trunk

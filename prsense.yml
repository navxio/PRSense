llm:
  provider: ollama
  model: deepseek-coder-v2
  temperature: 0.1

embeddings:
  provider: ollama
  model: nomic-embed-text

review:
  confidenceThreshold: 0.8
  maxSignals: 3

index:
  auto: true
  chunkSizeChars: 1000
  chunkOverlapChars: 200

context:
  maxChunks: 5

git:
  baseBranch: main

delivery:
  platform: github
